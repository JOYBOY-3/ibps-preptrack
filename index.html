  <title>PrepTrack — IBPS Clerk 2026</title>
  <meta name="description" content="A 147-day study companion for IBPS Clerk 2026. Tells you what to study for the next four hours, tracks whether you did it, and shows what is slipping.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090e12" media="(prefers-color-scheme: dark)">

  <link rel="preload" href="./assets/fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a5b6e'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='800' fill='white' text-anchor='middle'>PT</text></svg>">
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <!-- iOS ignores the web manifest for these. Without apple-touch-icon it uses a
       SCREENSHOT of the page as the home-screen icon, and without
       apple-mobile-web-app-capable it opens inside Safari chrome rather than
       standalone. Both are required for "Add to Home Screen" to look like an app. -->
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PrepTrack">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <noscript>
    <p style="padding:2rem;max-width:60ch;margin:auto">
      PrepTrack needs JavaScript. All your progress is stored in this browser —
      nothing is uploaded anywhere — but that does require scripting to be enabled.
    </p>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
